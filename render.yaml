databases:
  - name: destekflow-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "17"
    databaseName: destekflow
    user: destekflow

services:
  - type: web
    name: destekflow
    runtime: ruby
    plan: free
    region: frankfurt
    branch: master
    buildCommand: bundle install && bundle exec rails assets:precompile && bundle exec rails db:migrate && bundle exec rails db:seed
    startCommand: bundle exec rails server -b 0.0.0.0 -p $PORT
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: destekflow-db
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: true
      - key: WEB_CONCURRENCY
        value: 2
      - key: DB_SSLMODE
        value: require
