databases:
  - name: destekflow-db
    databaseName: destekflow
    user: destekflow

services:
  - type: web
    name: destekflow
    runtime: ruby
    plan: free
    buildCommand: bundle install && bundle exec rails assets:precompile
    preDeployCommand: bundle exec rails db:migrate && bundle exec rails db:seed
    startCommand: bundle exec rails server -b 0.0.0.0 -p $PORT
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: destekflow-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: RAILS_LOG_TO_STDOUT
        value: true
      - key: DB_SSLMODE
        value: require
  - type: cron
    name: destekflow-auto-close
    runtime: ruby
    schedule: "0 * * * *"
    buildCommand: bundle install
    startCommand: bundle exec rails runner "CloseResolvedTicketsJob.perform_now"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: destekflow-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: DB_SSLMODE
        value: require
